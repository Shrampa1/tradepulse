name: Android build

# Builds a real, installable APK entirely in the cloud -- no local
# Android Studio or Expo account needed. `expo prebuild` generates the
# native android/ project from app.json fresh every run (this repo
# doesn't commit one), then a plain Gradle build takes it from there --
# same recipe as the S.Ops Capacitor app's own CI, adapted for Expo's
# managed workflow instead of `cap sync`.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Client-side, safe-to-expose values (see .env.example's own header
      # comment) -- baked in at build time since Expo inlines EXPO_PUBLIC_*
      # vars into the JS bundle, not read at runtime. Set as repo secrets
      # (Settings -> Secrets and variables -> Actions) rather than
      # hardcoded here just to keep them out of the workflow file itself.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_CURRENCY: USD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This project's own package.json needs --legacy-peer-deps locally
      # too (lucide-react-native's peer dep caps at React 18, this project
      # is on React 19) -- see the repo's own install notes.
      - run: npm install --legacy-peer-deps

      # react-native-exception-handler (added for the temporary crash
      # reporter -- see src/lib/crashReporter.ts) is unmaintained and its
      # own android/build.gradle still calls the long-shutdown jcenter()
      # repository. On the Gradle/AGP version Expo 57's prebuild generates,
      # jcenter() isn't just empty, it no longer exists as a method at all,
      # so the build fails immediately with "Could not find method
      # jcenter()" while configuring that project. Its buildscript block
      # declares zero actual dependencies (nothing in node_modules'
      # published source uses jcenter for anything), so swapping it for
      # mavenCentral() is a no-op for what actually gets resolved -- same
      # "patch the generated/vendored file directly" approach as the
      # gradle.properties fix below, since there's no upstream fix to pull
      # in for an abandoned package.
      - name: Patch react-native-exception-handler's dead jcenter() repo
        run: sed -i 's/jcenter()/mavenCentral()/' node_modules/react-native-exception-handler/android/build.gradle

      - name: Generate the native android/ project from app.json
        run: npx expo prebuild --platform android --no-install

      # Two prior attempts to disable this via app.json (a bare
      # android.edgeToEdgeEnabled key, then the expo-build-properties
      # plugin's android.edgeToEdgeEnabled) both had NO effect -- verified
      # via the diagnostic step below, gradle.properties kept coming out
      # with edgeToEdgeEnabled=true either way. Rather than guess at a
      # third Expo-level mechanism blind, force it directly in the
      # generated file right before Gradle reads it -- guaranteed to work
      # regardless of whatever Expo's own config plugin resolution is
      # doing (or not doing) with the app.json setting.
      - name: Force-disable edgeToEdgeEnabled in the generated project
        run: |
          sed -i 's/^edgeToEdgeEnabled=.*/edgeToEdgeEnabled=false/' android/gradle.properties
          grep '^edgeToEdgeEnabled=' android/gradle.properties

      # Diagnostic only -- the app installs fine but crashes to a blank
      # screen on launch with no crash dialog, which usually means either a
      # very early native-init failure or something in how the generated
      # project is configured (New Architecture on/off, minification, the
      # launch Activity's own manifest entry). None of this is committed
      # to the repo (expo prebuild regenerates it fresh every run), so
      # printing it here is the only way to see it without device logs.
      # Grepped down to just the interesting lines -- the full files were
      # mostly template boilerplate that took several minutes of scrolling
      # a live-tailing log to get past.
      - name: Print generated native config for diagnosis
        run: |
          echo "===== android/gradle.properties: non-comment, non-blank lines ====="
          grep -vE '^\s*(#|$)' android/gradle.properties
          echo
          echo "===== android/app/build.gradle: signingConfig / minify / shrink lines ====="
          grep -nE 'signingConfig|minifyEnabled|shrinkResources|enableProguard' android/app/build.gradle
          echo
          echo "===== AndroidManifest.xml: <application> and <activity> tags ====="
          grep -nE '<application|<activity|android:theme|android:exported|android:launchMode' android/app/src/main/AndroidManifest.xml

      - name: Read the compileSdkVersion expo prebuild generated
        id: sdk
        run: |
          VERSION=$(grep -rhoE 'compileSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+' android/build.gradle android/app/build.gradle 2>/dev/null | grep -oE '[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then VERSION=35; fi
          echo "Detected compileSdkVersion: $VERSION"
          echo "compile_sdk=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # See sops-mobile's own workflow for why "tools" is left out --
          # same removed-legacy-package issue applies here.
          packages: "platform-tools platforms;android-${{ steps.sdk.outputs.compile_sdk }}"

      # assembleDebug, not assembleRelease -- a debug React Native/Expo
      # build does NOT embed the JS bundle; it expects to fetch it live
      # from a Metro dev server on the build machine's network. Installed
      # standalone with no Metro reachable, it crashes on launch with
      # nothing to run (this is unlike the Capacitor/S.Ops app, whose web
      # assets are always bundled into the APK regardless of build type).
      # assembleRelease embeds the JS + assets and gets minified/shrunk --
      # Expo's default generated build.gradle signs the release variant
      # with the same debug keystore unless a real one is configured, so
      # this stays installable without any extra signing setup.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tradepulse-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
